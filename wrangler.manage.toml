# LOCAL DEVELOPMENT ONLY — never deploy this profile. Wrangler can automatically
# provision real D1/R2 resources on deploy when remote identifiers are absent.
# Disabling workers.dev and preview URLs is not a deployment safeguard.
# Runtime variables and key material must come from an explicit private dotenv file.
name = "forge-manage-local"
main = "adapters/http/manageWorker.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["enable_request_signal", "unhandled_rejection_after_microtask_checkpoint"]
workers_dev = false
preview_urls = false
send_metrics = false
tsconfig = "tsconfig.engine.json"

[observability]
enabled = false

[dev]
ip = "127.0.0.1"
host = "manage.example.test"
upstream_protocol = "https"
local_protocol = "http"

[[d1_databases]]
binding = "DB"
database_name = "forge-manage-local"
migrations_dir = "migrations"
remote = false

[[r2_buckets]]
binding = "REVISION_BYTES"
remote = false
