# LOCAL DEVELOPMENT ONLY — never deploy this profile. Missing remote IDs can
# cause Wrangler to provision resources on deploy. Use a private dotenv file.
name = "forge-read-local"
main = "adapters/http/readWorker.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["enable_request_signal", "unhandled_rejection_after_microtask_checkpoint"]
workers_dev = false
preview_urls = false
send_metrics = false
tsconfig = "tsconfig.engine.json"

[observability]
enabled = false

[dev]
ip = "127.0.0.1"
host = "read.example.test"
upstream_protocol = "https"
local_protocol = "http"

[[d1_databases]]
binding = "DB"
database_name = "forge-manage-local"
migrations_dir = "migrations"
remote = false

[[r2_buckets]]
binding = "REVISION_BYTES"
remote = false
